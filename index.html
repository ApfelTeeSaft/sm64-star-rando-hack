<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>SM64 Star Randomizer</title>
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
		<link rel="stylesheet" href="app.css" />
		<link rel="icon" href="favicon.png" />
	</head>
	<body>
		<main class="container">
			<header>
				<h1>⭐ SM64 Star Randomizer</h1>
				<p class="subtitle">Pick a random star — press the button or hit <kbd>Space</kbd>.</p>
			</header>
			<div class="layout">
				<section class="panel star-panel">
					<div class="panel-controls">
						<div class="control-row">
							<select id="templateSelect"></select>
							<button class="outline secondary icon-btn" id="deleteTemplateBtn" title="Delete template">
								✕
							</button>
						</div>
						<div class="control-row">
							<input type="text" id="templateName" placeholder="New template name…" />
							<button class="outline" id="saveTemplateBtn">Save</button>
						</div>
						<label class="toggle-all-label">
							<input type="checkbox" id="toggleAllCheckbox" checked />
							<span>Select all</span>
						</label>
					</div>
					<div id="starList"></div>
				</section>
				<section class="panel run-panel">
					<div id="starDisplay" class="star-display"></div>
					<div id="runStatus" class="run-status"></div>
					<div class="run-options">
						<div class="run-option-row">
							<label for="runMaxStars">Stars</label>
							<input type="number" id="runMaxStars" min="1" placeholder="All" />
						</div>
						<div class="run-option-row">
							<label for="runOrderByStage">Order by stage</label>
							<input type="checkbox" id="runOrderByStage" />
						</div>
						<div class="diff-weights">
							<span class="diff-weights-label">Difficulty weights</span>
							<div class="diff-weight-row">
								<span class="diff-weight-label dw1">●</span>
								<input type="range" id="diffWeight1" min="0" max="5" value="5" />
								<span class="diff-weight-val" id="diffWeight1Val">5</span>
							</div>
							<div class="diff-weight-row">
								<span class="diff-weight-label dw2">●</span>
								<input type="range" id="diffWeight2" min="0" max="5" value="5" />
								<span class="diff-weight-val" id="diffWeight2Val">5</span>
							</div>
							<div class="diff-weight-row">
								<span class="diff-weight-label dw3">●</span>
								<input type="range" id="diffWeight3" min="0" max="5" value="5" />
								<span class="diff-weight-val" id="diffWeight3Val">5</span>
							</div>
							<div class="diff-weight-row">
								<span class="diff-weight-label dw4">●</span>
								<input type="range" id="diffWeight4" min="0" max="5" value="5" />
								<span class="diff-weight-val" id="diffWeight4Val">5</span>
							</div>
							<div class="diff-weight-row">
								<span class="diff-weight-label dw5">●</span>
								<input type="range" id="diffWeight5" min="0" max="5" value="5" />
								<span class="diff-weight-val" id="diffWeight5Val">5</span>
							</div>
						</div>
					</div>
					<div class="run-buttons">
						<button id="startRunBtn">▶ Start Run</button>
						<button class="outline secondary" id="endRunBtn" disabled>■ End Run</button>
					</div>
					<hr />
					<label for="voices">Voice</label>
					<select id="voices"></select>
					<button id="pickStarBtn" class="pick-btn">🎲 Pick a Random Star</button>
				</section>
			</div>
			<footer class="container">
				<p>
					Made by
					<a href="https://twitch.tv/dropmaniagaming" target="_blank" rel="noopener noreferrer">DropMania</a>
				</p>
			</footer>
		</main>
	</body>
	<script type="module" src="app.js"></script>
</html>
